<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Oracle Quantitative Engine - Execution Center</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    :root {
      --bg: #090d14;
      --panel: #111823;
      --panel-hover: #172130;
      --line: #223044;
      --text: #e6f0ff;
      --muted: #8ca0ba;
      --good: #3ddc97;
      --warn: #ffc857;
      --bad: #ff5370;
      --blue: #539bf5;
      --accent: #22d3ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 1500px; margin: 0 auto; padding: 12px; }
    
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 12px;
      gap: 10px;
    }
    .brand-title { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .brand-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; box-shadow: 0 0 8px var(--good); }
    
    .tier-indicator {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      font-weight: 700;
      font-size: 12px;
    }
    .tier-stat { display: flex; align-items: center; gap: 6px; }
    .tier-dot { width: 8px; height: 8px; border-radius: 50%; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .tab {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .tab:hover { background: var(--panel-hover); color: var(--text); }
    .tab.active { background: var(--blue); color: #000; border-color: var(--blue); }
    .tab.execute-tab.active { background: var(--good); color: #000; border-color: var(--good); }
    .tab.watch-tab.active { background: var(--warn); color: #000; border-color: var(--warn); }
    .tab.dead-tab.active { background: var(--bad); color: #fff; border-color: var(--bad); }

    .search-input {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      outline: none;
      width: 180px;
    }
    .search-input:focus { border-color: var(--blue); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 10px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card.EXECUTE { border-color: var(--good); box-shadow: 0 0 10px rgba(61, 220, 151, 0.15); }
    .card.WATCH { border-color: rgba(255, 200, 87, 0.4); }
    .card.DEAD { opacity: 0.6; }

    .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .pair-name { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
    
    .dir-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .dir-badge.LONG { background: rgba(61, 220, 151, 0.15); color: var(--good); border: 1px solid rgba(61, 220, 151, 0.3); }
    .dir-badge.SHORT { background: rgba(255, 83, 112, 0.15); color: var(--bad); border: 1px solid rgba(255, 83, 112, 0.3); }

    .prism-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 8px;
      margin: 6px 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .p-item { font-size: 11px; }
    .p-item .lbl { color: var(--muted); }
    .p-item .val { font-weight: 700; color: var(--text); }

    .targets-box {
      background: rgba(34, 211, 238, 0.05);
      border: 1px solid rgba(34, 211, 238, 0.2);
      border-radius: 8px;
      padding: 8px;
      margin: 6px 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .targets-box .val-sl { font-weight: 800; color: var(--bad); }
    .targets-box .val-tp { font-weight: 800; color: var(--good); }

    .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .tag {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .tag.highlight { border-color: var(--accent); color: var(--accent); }

    .card-foot {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }
    .tier-tag-execute { color: var(--good); font-weight: 800; }
    .tier-tag-watch { color: var(--warn); font-weight: 700; }
    .tier-tag-dead { color: var(--bad); font-weight: 600; }

    .empty-state {
      grid-column: 1 / -1;
      padding: 50px 20px;
      text-align: center;
      background: var(--panel);
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--muted);
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand-title"><span class="dot"></span> Oracle Trade Execution Hub</div>
      <div style="color:var(--muted); font-size:12px; margin-top:2px;" id="timestamp-hdr">Syncing PRISM stream...</div>
    </div>
    
    <div class="tier-indicator">
      <div class="tier-stat"><span class="tier-dot" style="background:var(--good)"></span> EXECUTE NOW: <span id="cnt-execute" style="color:var(--good)">0</span></div>
      <div class="tier-stat"><span class="tier-dot" style="background:var(--warn)"></span> WATCHING: <span id="cnt-watch" style="color:var(--warn)">0</span></div>
      <div class="tier-stat"><span class="tier-dot" style="background:var(--bad)"></span> INACTIVE: <span id="cnt-dead" style="color:var(--bad)">0</span></div>
    </div>
  </header>

  <div class="controls">
    <div class="tabs">
      <button class="tab execute-tab active" onclick="filterTab('EXECUTE', this)">EXECUTE NOW (<span id="tab-cnt-execute">0</span>)</button>
      <button class="tab watch-tab" onclick="filterTab('WATCH', this)">WATCH / IMPROVING (<span id="tab-cnt-watch">0</span>)</button>
      <button class="tab dead-tab" onclick="filterTab('DEAD', this)">DEAD / BAD SETUPS (<span id="tab-cnt-dead">0</span>)</button>
      <button class="tab" onclick="filterTab('ALL', this)">ALL CANDIDATES</button>
    </div>
    <input type="text" id="search" class="search-input" placeholder="Filter Pair..." oninput="renderCards()">
  </div>

  <div class="grid" id="cards-grid"></div>
</div>

<script>
let joinedData = [];
let currentTab = 'EXECUTE';

function extractSpeedPhase(speedObj) {
  if (!speedObj) return 'N/A';
  if (typeof speedObj === 'string') return speedObj;
  if (typeof speedObj === 'object') {
    return speedObj.phase || speedObj.speed_phase || speedObj.name || 'UNKNOWN';
  }
  return String(speedObj);
}

function classifyTier(item) {
  const card = item.card_payload || {};
  const dt = card.delta_tempo_timing || {};
  const phase = extractSpeedPhase(dt.speed_phase).toUpperCase();
  const matched = item.timestamp_matched;
  const state = (dt.state || '').toUpperCase();

  // Tier 1: EXECUTE NOW - High volume match + Accelerating speed
  if (matched && (phase === 'ACCELERATING' || phase === 'IMPULSE') && state !== 'GATED') {
    return 'EXECUTE';
  }
  
  // Tier 2: WATCH / IMPROVING - Matched or forming setup with pullback/decay
  if (matched || phase === 'IMPULSE_DECAY' || phase === 'PULLBACK' || state === 'AVAILABLE') {
    return 'WATCH';
  }

  // Tier 3: DEAD / BAD
  return 'DEAD';
}

function parsePrice(val) {
  if (val === undefined || val === null || val === 'N/A') return 'N/A';
  const num = Number(val);
  if (isNaN(num)) return 'N/A';
  return `$${num.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4})}`;
}

async function fetchFeed() {
  try {
    const res = await fetch('./oracle_joined_delta_prism_v1.json?ts=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const payload = await res.json();
    
    joinedData = payload.joined_data || [];
    
    document.getElementById('timestamp-hdr').textContent = 
      `PRISM Feed Active | Evaluated ${payload.total_cards_evaluated} Cards`;

    updateCounters();
    renderCards();
  } catch (err) {
    document.getElementById('timestamp-hdr').textContent = 'Feed offline: ' + err.message;
    document.getElementById('cards-grid').innerHTML = 
      `<div class="empty-state">Unable to load active trading stream.</div>`;
  }
}

function updateCounters() {
  let executeCount = 0;
  let watchCount = 0;
  let deadCount = 0;

  joinedData.forEach(item => {
    const tier = classifyTier(item);
    if (tier === 'EXECUTE') executeCount++;
    else if (tier === 'WATCH') watchCount++;
    else deadCount++;
  });

  document.getElementById('cnt-execute').textContent = executeCount;
  document.getElementById('cnt-watch').textContent = watchCount;
  document.getElementById('cnt-dead').textContent = deadCount;

  document.getElementById('tab-cnt-execute').textContent = executeCount;
  document.getElementById('tab-cnt-watch').textContent = watchCount;
  document.getElementById('tab-cnt-dead').textContent = deadCount;
}

function filterTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderCards();
}

function renderCards() {
  const grid = document.getElementById('cards-grid');
  const search = document.getElementById('search').value.toUpperCase().trim();

  const filtered = joinedData.filter(item => {
    const pair = (item.pair || '').toUpperCase();
    const tier = classifyTier(item);

    if (search && !pair.includes(search)) return false;
    if (currentTab !== 'ALL' && tier !== currentTab) return false;

    return true;
  });

  if (!filtered.length) {
    if (currentTab === 'EXECUTE') {
      grid.innerHTML = `<div class="empty-state">No Executable Signals Available<br><span style="font-size:12px; font-weight:400; color:var(--muted)">All candidates currently in Watch or Inactive tiers.</span></div>`;
    } else {
      grid.innerHTML = `<div class="empty-state">No candidates match current tier filter.</div>`;
    }
    return;
  }

  grid.innerHTML = filtered.map(item => {
    const card = item.card_payload || {};
    const prismBar = item.matched_prism_bar || {};
    const dt = card.delta_tempo_timing || {};
    const pair = item.pair || 'UNKNOWN';
    const dir = dt.direction || 'NEUTRAL';
    const tier = classifyTier(item);
    
    const speedDisplay = extractSpeedPhase(dt.speed_phase);
    
    const closePrice = parsePrice(prismBar.close);
    const highPrice = parsePrice(prismBar.high);
    const lowPrice = parsePrice(prismBar.low);
    const volume = prismBar.volume ? Number(prismBar.volume).toFixed(2) : 'N/A';

    // Risk targets
    const sl = parsePrice(card.stop_loss || card.sl || (dir === 'SHORT' ? prismBar.high : prismBar.low));
    const tp = parsePrice(card.take_profit || card.tp || (dir === 'SHORT' ? (prismBar.close * 0.98) : (prismBar.close * 1.02)));

    let tierLabel = '<span class="tier-tag-execute">● READY TO EXECUTE</span>';
    if (tier === 'WATCH') tierLabel = '<span class="tier-tag-watch">▲ WATCHING / FORMING</span>';
    if (tier === 'DEAD') tierLabel = '<span class="tier-tag-dead">✕ INACTIVE / DEAD</span>';

    return `
      <article class="card ${tier}">
        <div>
          <div class="card-head">
            <div>
              <div class="pair-name">${pair}</div>
              <div style="font-size:11px; color:var(--muted);">${card.canonical_pair || pair}</div>
            </div>
            <span class="dir-badge ${dir}">${dir}</span>
          </div>

          <div class="prism-box">
            <div class="p-item"><span class="lbl">15m Close:</span> <span class="val">${closePrice}</span></div>
            <div class="p-item"><span class="lbl">Volume:</span> <span class="val">${volume}</span></div>
            <div class="p-item"><span class="lbl">15m High:</span> <span class="val">${highPrice}</span></div>
            <div class="p-item"><span class="lbl">15m Low:</span> <span class="val">${lowPrice}</span></div>
          </div>

          <div class="targets-box">
            <div class="p-item"><span class="lbl">Stop Loss (SL):</span> <span class="val-sl">${sl}</span></div>
            <div class="p-item"><span class="lbl">Take Profit (TP):</span> <span class="val-tp">${tp}</span></div>
          </div>

          <div class="tags">
            <span class="tag highlight">SPEED: ${speedDisplay}</span>
            <span class="tag">STATE: ${dt.state || 'OK'}</span>
          </div>
        </div>

        <div class="card-foot">
          <span>Bar: ${item.reference_bar_raw || 'N/A'}</span>
          ${tierLabel}
        </div>
      </article>
    `;
  }).join('');
}

fetchFeed();
setInterval(fetchFeed, 30000);
</script>
</body>
</html>
