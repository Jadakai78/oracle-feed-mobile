<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oracle Prop Review Feed</title>
<style>
:root{--bg:#09111d;--panel:#111d2d;--line:#263952;--text:#e9f2ff;--muted:#9bb0c8;--green:#3ddc97;--yellow:#ffc857;--red:#ff647c;--blue:#63b3ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:1440px;margin:auto;padding:20px}header{display:flex;gap:18px;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:16px}h1{font-size:23px;margin:0 0 4px}.sub{color:var(--muted)}.badge{border:1px solid var(--yellow);color:var(--yellow);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700;white-space:nowrap}.health{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}.stat b{display:block;font-size:19px}.stat span{color:var(--muted);font-size:12px}.notice{padding:12px;border-radius:8px;background:#172338;border:1px solid #2e4667;color:var(--muted);margin-bottom:16px}.error{border-color:#6b3040;color:#ffb6c2}section{margin:22px 0}h2{font-size:17px;margin:0 0 9px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:10px}.card{border-left:4px solid var(--blue)}.best{border-left-color:var(--green)}.watch{border-left-color:var(--blue)}.shield{border-left-color:var(--yellow)}.reject{border-left-color:var(--red)}.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.pair{font-weight:800;font-size:17px}.score{font-size:18px;font-weight:800}.tags{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}.tag{border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:11px;color:var(--muted)}.tag.clear{color:var(--green);border-color:#246849}.tag.caution{color:var(--yellow);border-color:#715620}.tag.block{color:var(--red);border-color:#743343}.claim{color:#cad8ea;margin:8px 0}.meta{color:var(--muted);font-size:12px}.empty{color:var(--muted);padding:12px;border:1px dashed var(--line);border-radius:8px}@media(max-width:600px){.wrap{padding:14px}header{display:block}.badge{display:inline-block;margin-top:10px}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>Oracle Prop Review Feed</h1><div class="sub">APRIL 12 · 49-pair context · manual review</div></div><div class="badge">NO TRADE AUTHORIZATION</div></header>
<div id="notice" class="notice">Loading Oracle Prop context feed…</div>
<div id="health" class="health"></div>
<section><h2>Micro Watchlist</h2><div id="micro" class="grid"></div></section>
<section><h2>Best Now</h2><div id="best" class="grid"></div></section>
<section><h2>Watch / Needs Trigger</h2><div id="watch" class="grid"></div></section>
<section><h2>Shielded</h2><div id="shield" class="grid"></div></section>
<section><h2>Rejected / Context</h2><div id="reject" class="grid"></div></section>
</div>
<script>
const el=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function empty(target,msg){target.innerHTML=`<div class="empty">${esc(msg)}</div>`}
function card(c,kind){const tags=[c.directional_context,c.market_type,c.structure,c.tempo,c.flow,c.location,c.review_state].filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join('');const shield=String(c.shield||'UNKNOWN').toLowerCase();const role=c.correlation_role?` · ${esc(c.correlation_role)}`:'';return `<article class="card ${kind}"><div class="top"><div><div class="pair">${esc(c.pair)}</div><div class="meta">${esc(c.correlation_group||'UNCLUSTERED')}${role}</div></div><div class="score">${esc(c.context_score)}</div></div><div class="tags"><span class="tag ${shield}">SHIELD: ${esc(c.shield)}</span>${tags}</div><div class="claim">${esc(c.context_claim||(c.reason_codes||[]).join(', ')||'NO CONTEXT CLAIM')}</div><div class="meta">Micro state: ${esc(c.micro_state||'OFF')}</div></article>`}
function renderList(id,list,kind,msg){const target=el(id);if(!Array.isArray(list)||!list.length)return empty(target,msg);target.innerHTML=list.map(c=>card(c,kind)).join('')}
function stat(value,label){return `<div class="stat"><b>${esc(value)}</b><span>${esc(label)}</span></div>`}
async function load(){try{const r=await fetch('./oracle_prop_feed_v1.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(d.recordtype!=='ORACLEPROPFEED'||d.venue!=='PROP'||d.universe!=='APRIL_12_FIXED')throw new Error('invalid Oracle Prop payload');const h=d.health||{};const pending=!d.generated_at_utc||!h.pair_count;el('notice').className='notice'+(pending?' error':'');el('notice').textContent=pending?'Awaiting local adapter publish. This panel is read-only and cannot authorize a trade.':`Context: ${d.context_generated_at_utc||'unknown'} · Age: ${d.context_age_seconds??'unknown'}s · Manual review only.`;el('health').innerHTML=[stat(h.pair_count??0,'Pairs'),stat(h.best_now_count??0,'Best Now'),stat(h.watch_needs_trigger_count??0,'Watch'),stat(h.shielded_count??0,'Shielded'),stat(h.rejected_context_count??0,'Rejected'),stat(h.micro_watchlist_count??0,'Micro watchlist')].join('');const t=d.tiers||{};renderList('micro',d.micro_watchlist,'best','No candidates are armed for the micro layer.');renderList('best',t.best_now,'best','No Best Now context.');renderList('watch',t.watch_needs_trigger,'watch','No Watch context.');renderList('shield',t.shielded,'shield','No Shielded context.');renderList('reject',t.rejected_context,'reject','No Rejected context.')}catch(err){el('notice').className='notice error';el('notice').textContent='Feed unavailable: '+err.message;el('health').innerHTML='';['micro','best','watch','shield','reject'].forEach(id=>empty(el(id),'No validated Oracle Prop feed is available.'));}}load();setInterval(load,60000);
</script>
</body>
</html>
