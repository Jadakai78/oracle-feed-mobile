<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>April 12 Battlefield Board</title>
  <style>
    :root {
      --bg: #070b12;
      --panel: #0f1724;
      --panel2: #131e2d;
      --border: #28364a;
      --text: #e7edf6;
      --muted: #8ca0bb;
      --cyan: #22d3ee;
      --green: #4ade80;
      --amber: #fbbf24;
      --red: #fb7185;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #142136 0%, var(--bg) 46%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell {
      width: min(1540px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .command-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2.35rem);
      letter-spacing: 0.04em;
    }

    .subhead {
      margin-top: 7px;
      color: var(--muted);
      font-size: 0.92rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .health {
      min-width: 190px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(15, 23, 36, 0.9);
      text-align: right;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .health strong {
      display: block;
      margin-top: 4px;
      color: var(--green);
      font-size: 0.92rem;
      letter-spacing: 0.05em;
    }

    .telemetry {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .telemetry-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(15, 23, 36, 0.85);
      padding: 12px;
    }

    .telemetry-card span {
      display: block;
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
    }

    .telemetry-card strong {
      display: block;
      margin-top: 7px;
      font-size: 1.3rem;
      color: var(--cyan);
    }

    .board-tabs {
      display: flex;
      gap: 10px;
      margin: 18px 0;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .board-tab {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #111b2a;
      color: var(--muted);
      cursor: pointer;
      font-weight: 800;
      letter-spacing: 0.1em;
      padding: 11px 18px;
    }

    .board-tab.active {
      background: #0e7490;
      border-color: var(--cyan);
      color: #ecfeff;
    }

    .board-panel {
      display: none;
    }

    .board-panel.active {
      display: block;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin: 8px 0 14px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.1em;
    }

    .panel-header span {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 12px;
    }

    .card {
      min-height: 255px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: linear-gradient(145deg, rgba(19, 30, 45, 0.98), rgba(10, 16, 27, 0.98));
      padding: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }

    .pair {
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 0.06em;
    }

    .badge {
      max-width: 155px;
      padding: 5px 7px;
      border-radius: 6px;
      font-size: 0.66rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      line-height: 1.25;
      text-align: right;
    }

    .locked {
      background: rgba(74, 222, 128, 0.15);
      color: var(--green);
      border: 1px solid rgba(74, 222, 128, 0.4);
    }

    .tracking {
      background: rgba(34, 211, 238, 0.12);
      color: var(--cyan);
      border: 1px solid rgba(34, 211, 238, 0.35);
    }

    .no-shot {
      background: rgba(251, 113, 133, 0.12);
      color: var(--red);
      border: 1px solid rgba(251, 113, 133, 0.35);
    }

    .fault {
      background: rgba(251, 191, 36, 0.12);
      color: var(--amber);
      border: 1px solid rgba(251, 191, 36, 0.35);
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .metric {
      border: 1px solid rgba(40, 54, 74, 0.8);
      border-radius: 7px;
      background: rgba(7, 11, 18, 0.5);
      padding: 8px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 0.62rem;
      letter-spacing: 0.08em;
    }

    .metric strong {
      display: block;
      margin-top: 4px;
      color: var(--text);
      font-size: 0.77rem;
      overflow-wrap: anywhere;
    }

    .reason {
      margin-top: 12px;
      min-height: 32px;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .empty {
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 24px;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.08em;
    }

    @media (max-width: 740px) {
      .command-bar {
        flex-direction: column;
      }

      .health {
        min-width: 0;
        text-align: left;
      }

      .telemetry {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="command-bar">
      <div>
        <h1>APRIL 12 — BATTLEFIELD BOARD</h1>
        <div class="subhead">Signals: priority targets · Development: complete battlefield</div>
      </div>

      <div class="health">
        ENGINE STATUS
        <strong id="engine-health">CONNECTING</strong>
      </div>
    </header>

    <section class="telemetry">
      <div class="telemetry-card">
        <span>UNIVERSE</span>
        <strong id="configured-count">—</strong>
      </div>

      <div class="telemetry-card">
        <span>CANDLES ONLINE</span>
        <strong id="candles-count">—</strong>
      </div>

      <div class="telemetry-card">
        <span>TARGETS LOCKED</span>
        <strong id="signals-count">—</strong>
      </div>

      <div class="telemetry-card">
        <span>LAST SCAN</span>
        <strong id="scan-time">—</strong>
      </div>
    </section>

    <nav class="board-tabs" role="tablist">
      <button id="signals-tab" class="board-tab active" type="button" role="tab" aria-selected="true" onclick="switchBoardTab('signals')">
        SIGNALS
      </button>

      <button id="development-tab" class="board-tab" type="button" role="tab" aria-selected="false" onclick="switchBoardTab('development')">
        DEVELOPMENT
      </button>
    </nav>

    <section id="signals-panel" class="board-panel active" role="tabpanel">
      <div class="panel-header">
        <h2>PRIORITY TARGETS</h2>
        <span id="signal-note">Waiting for scan</span>
      </div>

      <div id="signals-grid" class="grid"></div>
    </section>

    <section id="development-panel" class="board-panel" role="tabpanel" hidden>
      <div class="panel-header">
        <h2>FULL BATTLEFIELD</h2>
        <span id="development-note">Every pairing remains visible here</span>
      </div>

      <div id="development-grid" class="grid"></div>
    </section>
  </main>

  <script>
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function switchBoardTab(tabName) {
      const signalsActive = tabName === "signals";

      document.getElementById("signals-tab").classList.toggle("active", signalsActive);
      document.getElementById("development-tab").classList.toggle("active", !signalsActive);

      document.getElementById("signals-tab").setAttribute("aria-selected", String(signalsActive));
      document.getElementById("development-tab").setAttribute("aria-selected", String(!signalsActive));

      const signalsPanel = document.getElementById("signals-panel");
      const developmentPanel = document.getElementById("development-panel");

      signalsPanel.classList.toggle("active", signalsActive);
      developmentPanel.classList.toggle("active", !signalsActive);

      signalsPanel.hidden = !signalsActive;
      developmentPanel.hidden = signalsActive;
    }

    function badgeClass(state) {
      if (
        state === "LOCKED IN" ||
        state === "PRESSURE BUILDING" ||
        state === "RELOAD ZONE"
      ) {
        return "locked";
      }

      if (
        state === "DATA FAULT" ||
        state === "BAD CANDLE" ||
        state === "NO FRESH BAR"
      ) {
        return "fault";
      }

      if (
        state === "NO SHOT" ||
        state === "MOMENTUM FADING"
      ) {
        return "no-shot";
      }

      return "tracking";
    }

    function metric(label, value) {
      return `
        <div class="metric">
          <span>${escapeHtml(label)}</span>
          <strong>${escapeHtml(value ?? "—")}</strong>
        </div>
      `;
    }

    function renderSignals(signals) {
      const grid = document.getElementById("signals-grid");
      const note = document.getElementById("signal-note");

      note.textContent =
        `${signals.length} priority target${signals.length === 1 ? "" : "s"}`;

      if (!signals.length) {
        grid.innerHTML =
          `<div class="empty">NO PRIORITY TARGETS — DEVELOPMENT HAS THE FULL FIELD</div>`;
        return;
      }

      grid.innerHTML = signals.map((signal) => {
        const state = signal.battle_state || "TRACKING";

        return `
          <article class="card">
            <div class="card-top">
              <div class="pair">${escapeHtml(signal.pair)}</div>
              <div class="badge ${badgeClass(state)}">${escapeHtml(state)}</div>
            </div>

            <div class="metrics">
              ${metric("SPEED", signal.speed_phase)}
              ${metric("DIRECTION", signal.speed_direction)}
              ${metric("PRISM", signal.prism_status)}
              ${metric("LAR", signal.lar_state)}
              ${metric("POOL SIDE", signal.lar_pool_side)}
              ${metric("POOL TYPE", signal.lar_pool_type)}
              ${metric("LAR READ", signal.lar_description)}
              ${metric("BAR", signal.event_timestamp_utc)}
            </div>

            <div class="reason">${escapeHtml(signal.reason || "TARGET DEVELOPING")}</div>
          </article>
        `;
      }).join("");
    }

    function renderDevelopment(cards) {
      const grid = document.getElementById("development-grid");
      const note = document.getElementById("development-note");

      note.textContent =
        `${cards.length} pairing${cards.length === 1 ? "" : "s"} on the board`;

      if (!cards.length) {
        grid.innerHTML =
          `<div class="empty">WAITING FOR FIRST COMPLETE SCAN</div>`;
        return;
      }

      grid.innerHTML = cards.map((card) => {
        const state = card.battle_state || "TRACKING";

        return `
          <article class="card">
            <div class="card-top">
              <div class="pair">${escapeHtml(card.pair)}</div>
              <div class="badge ${badgeClass(state)}">${escapeHtml(state)}</div>
            </div>

            <div class="metrics">
              ${metric("SCAN", card.scan_status)}
              ${metric("SPEED", card.speed_phase)}
              ${metric("DIRECTION", card.speed_direction)}
              ${metric("PRISM", card.prism_status)}
              ${metric("FIRST BLOCK", card.prism_first_block)}
              ${metric("LAR", card.lar_state)}
              ${metric("POOL", `${card.lar_pool_side ?? "—"} / ${card.lar_pool_type ?? "—"}`)}
              ${metric("BAR", card.event_timestamp_utc)}
            </div>

            <div class="reason">${escapeHtml(card.reason || card.lar_description || "TRACKING")}</div>
          </article>
        `;
      }).join("");
    }

    async function refreshBoard() {
      try {
        const response = await fetch("/api/observations", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`Feed returned HTTP ${response.status}`);
        }

        const payload = await response.json();
        const telemetry = payload.universe_telemetry || {};

        document.getElementById("configured-count").textContent =
          telemetry.configured_pair_count ?? "—";

        document.getElementById("candles-count").textContent =
          telemetry.candles_fetched_count ?? "—";

        document.getElementById("signals-count").textContent =
          payload.active_signals_count ?? 0;

        document.getElementById("scan-time").textContent =
          payload.timestamp ?? "—";

        document.getElementById("engine-health").textContent =
          payload.last_error ? "DEGRADED" : "ONLINE";

        renderSignals(payload.signals || []);
        renderDevelopment(payload.development_board || []);
      } catch (error) {
        document.getElementById("engine-health").textContent =
          "FEED OFFLINE";

        document.getElementById("signals-grid").innerHTML =
          `<div class="empty">SIGNAL FEED ERROR: ${escapeHtml(error.message)}</div>`;

        document.getElementById("development-grid").innerHTML =
          `<div class="empty">DEVELOPMENT FEED ERROR: ${escapeHtml(error.message)}</div>`;
      }
    }

    refreshBoard();
    setInterval(refreshBoard, 15000);
  </script>
</body>
</html>
